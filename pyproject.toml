[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-prediction-system"
version = "4.0.0"
description = "Point-in-time NFL forecasts with timestamped market consensus"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.49.1",
  "pandas==2.3.2",
  "numpy==2.2.6",
  "scikit-learn==1.7.1",
  "joblib==1.5.1",
  "nflreadpy==0.1.5",
  "polars==1.32.3",
  "pyarrow==21.0.0",
  "psycopg[binary]==3.2.10",
]

[tool.setuptools.packages.find]
include = ["nfl_prediction*", "cfb_prediction*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
files = ["nfl_prediction/owls.py", "nfl_prediction/current_market.py", "nfl_prediction/market_postgres.py", "nfl_prediction/market_parity.py", "nfl_prediction/market_ui.py", "current_market_update.py", "market_update.py", "serve.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
