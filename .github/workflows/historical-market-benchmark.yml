name: Historical market benchmark

on:
  workflow_dispatch:
    inputs:
      evaluation_seasons:
        description: "Evaluation seasons, such as 2023-2025"
        required: true
        default: "2023-2025"
        type: string
      weeks:
        description: "Weeks, such as 1-2 or 1-18"
        required: true
        default: "1-2"
        type: string
      max_credits:
        description: "Hard historical API budget"
        required: true
        default: "300"
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: historical-market-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'historical-market-pilot' || github.event.label.name == 'historical-market-full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run paid historical benchmark
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          INPUT_EVALUATION_SEASONS: ${{ inputs.evaluation_seasons }}
          INPUT_WEEKS: ${{ inputs.weeks }}
          INPUT_MAX_CREDITS: ${{ inputs.max_credits }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            evaluation_seasons="$INPUT_EVALUATION_SEASONS"
            weeks="$INPUT_WEEKS"
            max_credits="$INPUT_MAX_CREDITS"
          elif [ "$LABEL_NAME" = "historical-market-full" ]; then
            evaluation_seasons="2023-2025"
            weeks="1-18"
            max_credits="9000"
          else
            evaluation_seasons="2025"
            weeks="1-2"
            max_credits="300"
          fi
          python historical_market_benchmark.py \
            --training-seasons 2022-2025 \
            --evaluation-seasons "$evaluation_seasons" \
            --weeks "$weeks" \
            --max-credits "$max_credits" \
            --output market_benchmark.json
      - name: Verify aggregate-only artifact
        run: |
          python -c "import json; p=json.load(open('market_benchmark.json')); assert p['methodology']['raw_market_data_published'] is False; assert 'game_id' not in p"
          python -m pytest -q tests/test_historical_market.py tests/test_odds.py tests/test_market.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-market-benchmark
          path: market_benchmark.json
          retention-days: 7
