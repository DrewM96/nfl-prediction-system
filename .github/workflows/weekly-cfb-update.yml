name: Weekly CFB model update

on:
  workflow_dispatch:
    inputs:
      season:
        description: College football season (leave blank to detect automatically)
        required: false
        type: string
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-cfb-model-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve CFB season
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$REQUESTED_SEASON" ]; then
            season="$REQUESTED_SEASON"
          else
            season="$(python -c 'from cfb_prediction.season import current_cfb_season; print(current_cfb_season())')"
          fi
          echo "SEASON=$season" >> "$GITHUB_ENV"
          echo "Using CFB season $season"
      - name: Restore CollegeFootballData cache
        uses: actions/cache@v4
        with:
          path: data/cfb/cache
          key: cfb-data-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            cfb-data-${{ env.SEASON }}-
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Refresh and publish CFB forecast
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_production_update.py --season "$SEASON" --refresh-current
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Publish validated CFB artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/weekly-cfb-model-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add data/cfb
          if git diff --cached --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore: refresh weekly CFB forecasts"
          git push --force-with-lease origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --base main --head "$branch" --title "chore: refresh weekly CFB forecasts" --body "Automated frozen CFB forecast, settlement, rankings, and model refresh. The publishing workflow passed lint and the full test suite before opening this pull request.")"
            pr_number="${pr_url##*/}"
          elif [ "$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$pr_number"
          fi
          gh pr merge "$pr_number" --squash --match-head-commit "$(git rev-parse HEAD)"
