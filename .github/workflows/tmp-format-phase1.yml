name: Temporary format phase 1

on:
  push:
    branches:
      - feature/nfl-injury-phase1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nfl-injury-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.12.10
      - run: ruff format app.py nfl_prediction/pipeline.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py nfl_prediction/pipeline.py
          git commit -m "style: apply ruff formatting"
          git push
