name: Weekly model update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-model-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Refresh NFL market consensus
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python market_update.py --max-credits 2
      - name: Generate weekly NFL forecasts with market context
        run: python weekly_nfl_update.py
      - run: python -m pytest -q
      - name: Publish validated NFL artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/weekly-model-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add data models market_consensus.json performance_history.json official_injuries.json qb_data.json rb_data.json team_data.json update_log.json weekly_report.json weekly_schedule.json wr_data.json
          if git diff --cached --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore: refresh weekly NFL forecasts"
          git push --force-with-lease origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --base main --head "$branch" --title "chore: refresh weekly NFL forecasts" --body "Automated point-in-time data, model, market consensus, forecast, and performance refresh. The publishing workflow passed the full test suite before opening this pull request.")"
            pr_number="${pr_url##*/}"
          elif [ "$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$pr_number"
          fi
          gh pr merge "$pr_number" --squash --match-head-commit "$(git rev-parse HEAD)"
