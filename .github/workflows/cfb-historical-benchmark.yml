name: CFB ranking research evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore private CFBD cache
        uses: actions/cache/restore@v4
        with:
          path: data/cfb/cache
          key: cfb-ranking-research-readonly
          restore-keys: |
            cfb-data-2026-
            cfb-data-
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/test_cfb_ranking_evaluation.py tests/test_cfb_features.py tests/test_cfb_rankings.py -q
      - name: Evaluate ranking methods at historical weekly cutoffs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -u cfb_ranking_evaluation.py
      - name: Verify aggregate research output
        run: |
          python -c "import json; p=json.load(open('reports/cfb-ranking-evaluation/evaluation.json')); assert p['methodology']['raw_data_published'] is False; assert p['methodology']['holdout_season'] == 2025; assert not p['quick_mode']; assert p['metrics']['holdout_2025']['all']['schedule_projection']['games'] > 0"
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-ranking-evaluation
          path: reports/cfb-ranking-evaluation/evaluation.json
          retention-days: 14
