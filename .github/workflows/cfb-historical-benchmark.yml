name: Recover October 4 CFB rating inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact October 4 release cache
        uses: actions/cache/restore@v4
        with:
          path: data/cfb/cache
          key: cfb-data-2026-37214197278
          fail-on-cache-miss: true
      - run: python -m pip install -r requirements.txt
      - name: Rebuild and verify aggregate inputs without API access
        run: PYTHONPATH=. python reports/cfb-rating-inputs-2026-10-04/recover_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cfb-team-inputs-oct4
          path: recovered-cfb-inputs/team-inputs.json
          retention-days: 7
