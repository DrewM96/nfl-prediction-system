name: Temporary format QB shadow

on:
  push:
    branches:
      - feature/nfl-qb-shadow-validation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nfl-qb-shadow-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.12.10
      - run: ruff format nfl_prediction/qb_replacement.py tests/test_qb_replacement.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nfl_prediction/qb_replacement.py tests/test_qb_replacement.py
            git commit -m "style: format QB shadow changes"
            git push
          fi
