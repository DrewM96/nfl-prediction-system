name: Temporary format weekly UI

on:
  push:
    branches:
      - ui/nfl-weekly-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/nfl-weekly-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.12.10
      - run: ruff format app.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "style: format weekly UI tune-up"
            git push
          fi
