name: Temporary format model power ranking test

on:
  push:
    branches:
      - feature/model-power-rankings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-power-rankings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format tests/test_rankings.py
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-format-ranking-test.yml
          git add tests/test_rankings.py
          git config user.name "DrewM96"
          git config user.email "andrewmarch1996@gmail.com"
          git commit -m "style: format model power ranking test"
          git push origin HEAD:feature/model-power-rankings
