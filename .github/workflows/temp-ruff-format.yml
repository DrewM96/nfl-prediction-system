name: Temporary Ruff formatter

on:
  push:
    branches:
      - agent/player-availability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-availability
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format app.py tests/test_pipeline.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- app.py tests/test_pipeline.py; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_pipeline.py
          git commit -m "style: apply Ruff formatter"
          git push origin HEAD:agent/player-availability
