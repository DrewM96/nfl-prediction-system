name: Temporary format season transition benchmark

on:
  push:
    branches:
      - experiment/nfl-season-transition-weighting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/nfl-season-transition-weighting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.10
      - run: ruff format nfl_season_transition_benchmark.py
      - name: Commit formatted benchmark and remove temporary workflow
        run: |
          rm .github/workflows/tmp-format-season-transition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_season_transition_benchmark.py .github/workflows/tmp-format-season-transition.yml
          git commit -m "style: format season transition benchmark"
          git push
