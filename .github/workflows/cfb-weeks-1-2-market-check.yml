name: CFB Weeks 1-2 market check

on:
  push:
    branches: [analysis-cfb-weeks-1-2]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Compare frozen Weeks 1-2 forecasts with listed CFBD lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python cfb_weeks_1_2_market_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-weeks-1-2-market-check
          path: data/cfb/weeks_1_2_market_check.json
          retention-days: 7
