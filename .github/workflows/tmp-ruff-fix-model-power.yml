name: Temporary Ruff fix model power rankings

on:
  push:
    branches:
      - feature/model-power-rankings

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-power-rankings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --fix nfl_prediction/rankings.py
      - run: ruff format nfl_prediction/rankings.py
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-ruff-fix-model-power.yml
          git add nfl_prediction/rankings.py
          git config user.name "DrewM96"
          git config user.email "andrewmarch1996@gmail.com"
          git commit -m "style: organize model power ranking imports"
          git push origin HEAD:feature/model-power-rankings
